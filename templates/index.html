<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard - AI Phishing Detection</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Background -->
    <div class="background"></div>

    <!-- Main Container -->
    <div class="container">

        <!-- Logo -->
        <div class="logo">
            🛡️
        </div>

        <!-- Heading -->
        <h1>PhishGuard</h1>

        <p class="subtitle">
            AI Powered Phishing URL Detection System
        </p>

        <!-- URL Input -->
        <div class="search-box">

            <input
                type="url"
                id="url"
                placeholder="Enter website URL (Example: https://google.com)"
                autocomplete="off"
                spellcheck="false"
                required
            >

            <button onclick="detectURL()">
                Detect Website
            </button>

        </div>

        <!-- Result Card -->
        <div id="resultCard" class="result-card hidden">

            <h2 id="mainPrediction">Waiting...</h2>

            <p id="description"></p>

        </div>

        <!-- Comparison Table -->
        <div class="comparison">

            <h2>Model Comparison</h2>

            <table id="resultTable">

                <thead>

                    <tr>
                        <th>Model</th>
                        <th>Prediction</th>
                        <th>Confidence</th>
                    </tr>

                </thead>

                <tbody>

                </tbody>

            </table>

        </div>

        <!-- Footer -->
        <footer>

            Built using Flask + Machine Learning + Scikit-Learn

        </footer>

    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
