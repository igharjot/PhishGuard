
name: PhishGuard Security Scanning

on:
  workflow_call:

jobs:
  security-scans:
    name: Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # Python environment
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep bandit

      # SAST
      - name: Semgrep SAST Scan
        run: |
          semgrep scan --config auto --error .

      # Python SAST
      - name: Bandit Security Scan
        run: |
          bandit -r . -ll -x .git,.venv,venv

      # Secret scanning
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile linting
      - name: Hadolint Scan
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      # Filesystem vulnerability scanning
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
