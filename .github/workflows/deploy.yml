
name: PhishGuard CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: phishguard-production
  cancel-in-progress: false

jobs:
  build-test-deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

      REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

      IMAGE_URI: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

    steps:

      # 1. Checkout GitHub source code
      - name: Checkout Repository
        uses: actions/checkout@v7

      # 2. Validate GitHub configuration
      - name: Validate Configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in AWS_REGION AWS_ACCOUNT_ID ECR_REPOSITORY EC2_INSTANCE_ID AWS_ROLE_ARN; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub variable: $name"
              exit 1
            fi
          done

          echo "Configuration validated."

      # 3. Check Python syntax
      - name: Python Syntax Check
        run: |
          python -m py_compile app.py

      # 4. Build Docker image
      - name: Build Docker Image
        run: |
          docker build --pull -t "$IMAGE_URI" .

      # 5. Test Docker container before deployment
      - name: Test Docker Container
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name phishguard-ci \
            -p 127.0.0.1:5000:5000 \
            "$IMAGE_URI"

          cleanup() {
            docker logs phishguard-ci 2>/dev/null || true
            docker rm -f phishguard-ci 2>/dev/null || true
          }

          trap cleanup EXIT

          READY=false

          for attempt in {1..60}; do

            if curl -fsS http://127.0.0.1:5000/health; then
              READY=true
              break
            fi

            STATUS=$(docker inspect \
              --format '{{.State.Status}}' phishguard-ci \
              2>/dev/null || echo "missing")

            if [[ "$STATUS" == "exited" ]]; then
              echo "Container exited unexpectedly."
              docker logs phishguard-ci
              exit 1
            fi

            sleep 2
          done

          if [[ "$READY" != "true" ]]; then
            echo "Health check failed."
            docker logs phishguard-ci
            exit 1
          fi

          
          PREDICTION=$(curl -fsS \
           -X POST \
           -F "url=https://www.google.com" \
            http://127.0.0.1:5000/predict)

          echo "$PREDICTION" | jq -e '
            has("Random Forest") and
            has("Logistic Regression") and
            has("Naive Bayes") and
            has("Linear SVM")
          ' > /dev/null

          echo "All four ML models passed the prediction test."

          echo "Docker application test passed."

      # 6. Authenticate with AWS through GitHub OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: PhishGuardGitHubActions

      # 7. Verify AWS identity
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # 8. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 9. Push Docker image to ECR
      - name: Push Docker Image
        run: |
          docker push "$IMAGE_URI"

          echo "Image pushed successfully:"
          echo "$IMAGE_URI"

      
      # 10. Deploy to EC2 through Systems Manager
      - name: Deploy to EC2
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<EOF
          #!/bin/sh
          set -eu

          echo "Starting PhishGuard deployment..."

          LOGIN_PASSWORD=\$(aws ecr get-login-password --region ${AWS_REGION})
          printf '%s' "\$LOGIN_PASSWORD" | docker login --username AWS --password-stdin ${REGISTRY}
          unset LOGIN_PASSWORD

          docker pull ${IMAGE_URI}

          mkdir -p /opt/phishguard/prediction_logs

          docker rm -f phishguard || true

          docker run -d --name phishguard --restart unless-stopped -p 80:5000 -v /opt/phishguard/prediction_logs:/app/prediction_logs ${IMAGE_URI}

          echo "Waiting for application health check..."

          attempt=1

          while [ "\$attempt" -le 90 ]; do

            state=\$(docker inspect --format '{{.State.Status}}' phishguard 2>/dev/null || true)

            health=\$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' phishguard 2>/dev/null || true)

            if [ "\$state" = "running" ] && [ "\$health" = "healthy" ]; then
              curl -fsS http://127.0.0.1/health
              echo "PhishGuard deployed successfully!"
              exit 0
            fi

            if [ "\$state" = "exited" ] || [ "\$health" = "unhealthy" ]; then
              docker logs --tail 100 phishguard || true
              exit 1
            fi

            sleep 5
            attempt=\$((attempt + 1))
          done

          echo "Health check timed out."
          docker logs --tail 100 phishguard || true
          exit 1
          EOF
          )

          jq -n --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script]}' > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy PhishGuard ${GITHUB_SHA}" \
            --timeout-seconds 600 \
            --max-errors "0" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in {1..120}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            if [[ "$STATUS" == "Success" ]]; then

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text

              exit 0
            fi

            if [[ "$STATUS" == "Failed" || \
                  "$STATUS" == "Cancelled" || \
                  "$STATUS" == "TimedOut" || \
                  "$STATUS" == "Undeliverable" || \
                  "$STATUS" == "Terminated" ]]; then

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" || true

              exit 1
            fi

            sleep 5
          done

          echo "Deployment polling timed out."
          exit 1

