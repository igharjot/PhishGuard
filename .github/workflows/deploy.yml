
name: PhishGuard DevSecOps Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: phishguard-production
  cancel-in-progress: false

jobs:

  security:
    name: Security Scanning
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  ci:
    name: Continuous Integration
    needs: security
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write

  cd:
    name: Continuous Deployment
    needs: ci
    uses: ./.github/workflows/cd.yml
    permissions:
      contents: read
      id-token: write